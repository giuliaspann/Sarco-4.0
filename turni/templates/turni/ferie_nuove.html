{% extends 'turni/base.html' %}
{% block titolo %}Richiesta ferie{% endblock %}
{% block contenuto %}
<div class="intestazione">
  <a class="tasto-indietro" href="{% url 'turni:richieste' %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Richieste</a>
  <h1>Chiedi ferie o permesso</h1>
</div>
<form method="post" class="scheda">{% csrf_token %}
  <label>Tipo
    <select name="tipo">{% for v, nome in tipi %}<option value="{{ v }}" {% if dati.tipo == v %}selected{% endif %}>{{ nome }}</option>{% endfor %}</select>
  </label>
  <div class="riga-form">
    <label>Dal<input type="date" name="dal" min="{{ domani|date:'Y-m-d' }}" value="{{ dati.dal }}" required></label>
    <label>Al<input type="date" name="al" min="{{ domani|date:'Y-m-d' }}" value="{{ dati.al }}" required></label>
  </div>
  <label>Note per l'ufficio (facoltative)<textarea name="motivo" rows="2" maxlength="300">{{ dati.motivo }}</textarea></label>
  <button class="bottone pieno piena-larghezza">Invia all'ufficio</button>
  <p class="tenue piccolo">Quando l'ufficio approva, i giorni compaiono come ferie nei tuoi turni.</p>
</form>
{% endblock %}
