{% extends 'turni/base.html' %}
{% block titolo %}Richiesta ferie{% endblock %}
{% block contenuto %}
<div class="intestazione">
  <a class="tasto-indietro" href="{% url 'turni:miei_turni' %}#richieste"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Area personale</a>
  <h1>Chiedi ferie o permesso</h1>
</div>
<form method="post" class="scheda">{% csrf_token %}
  <div class="scegli">
    {% for v, nome in tipi %}<label><input type="radio" name="tipo" value="{{ v }}" {% if dati.tipo == v or not dati.tipo and forloop.first %}checked{% endif %}><span>{{ nome }}</span></label>{% endfor %}
  </div>
  <label><span class="solo-ferie">Dal</span><span class="solo-permesso">Giorno</span><input type="date" name="dal" min="{{ domani|date:'Y-m-d' }}" value="{{ dati.dal }}" required></label>
  <label class="solo-ferie">Al<input type="date" name="al" min="{{ domani|date:'Y-m-d' }}" value="{{ dati.al }}"></label>
  <div class="orari solo-permesso">
    <label>Dalle<input type="time" name="dalle" value="{{ dati.dalle }}" step="900"></label>
    <label>Alle<input type="time" name="alle" value="{{ dati.alle }}" step="900"></label>
  </div>
  <label>Note per l'ufficio (facoltative)<textarea name="motivo" rows="2" maxlength="300">{{ dati.motivo }}</textarea></label>
  <button class="bottone pieno piena-larghezza">Invia all'ufficio</button>
</form>
{% endblock %}
