{% extends 'turni/base.html' %}
{% block titolo %}Codice o QR code{% endblock %}
{% block contenuto %}
<a class="tasto-indietro" href="{% url 'turni:segnala' %}?{{ pre }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Indietro</a>
<div class="intestazione"><h1>Codice o QR code</h1></div>
<form method="get" class="scheda mn-form" data-qr>
  {% if lavoro %}<input type="hidden" name="lavoro" value="1">{% endif %}{% if a %}<input type="hidden" name="a" value="{{ a }}">{% endif %}
  <div class="qr-mirino" hidden><video playsinline muted></video><span>Inquadra il QR code attaccato alla macchina</span></div>
  <button type="button" class="bottone pieno piena-larghezza qr-avvia">📷 Inquadra il QR code</button>
  <label>Oppure scrivi il codice
    <input type="text" name="c" placeholder="Es. IMP2-NAS1 o la targa" autocomplete="off" autocapitalize="characters">
  </label>
  <button class="bottone piena-larghezza">Cerca</button>
</form>
{% endblock %}
