<p class="mn-sottotitolo">Con chi</p>
<div class="mn-colleghi">
  {% for d in colleghi_manut %}<label><input type="checkbox" name="collaboratori" value="{{ d.pk }}"><span>{{ d.nome_breve }}</span></label>{% endfor %}
</div>
{% if colleghi_altri %}
<details class="mn-altri-colleghi"><summary>Altri colleghi</summary>
  <div class="mn-colleghi">{% for d in colleghi_altri %}<label><input type="checkbox" name="collaboratori" value="{{ d.pk }}"><span>{{ d.nome_breve }}</span></label>{% endfor %}</div>
</details>
{% endif %}
<label class="bottone foto-btn mn-foto mn-video">
  <input type="file" name="video" accept="video/*">
  <span>🎥 Video</span>
</label>
<label>Cosa resta da fare (facoltativo)<textarea name="resta" rows="2" maxlength="1000" placeholder="Es. si può procedere al ripristino dei vecchi tamburi"></textarea></label>
