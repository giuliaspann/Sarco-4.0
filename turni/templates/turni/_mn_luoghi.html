{% if mostra_gruppi %}
<div class="mn-gruppi">
  <a href="?" class="{% if not gruppo %}attivo{% endif %}">Tutti</a>
  {% for g, nome, icona, _ in gruppi_filtro %}<a href="?gruppo={{ g }}" class="{% if gruppo == g %}attivo{% endif %}"><span>{{ icona }}</span>{{ nome }}</a>{% endfor %}
</div>
{% endif %}
{% if sotto %}
<div class="mn-luoghi">
  <a href="?gruppo={{ gruppo }}" class="{% if not luogo %}attivo{% endif %}">Tutti</a>
  {% for v, nome in sotto %}<a href="?luogo={{ v }}" class="{% if luogo == v %}attivo{% endif %}">{{ nome }}</a>{% endfor %}
</div>
{% endif %}
