<p class="mn-sottotitolo">Manutentore</p>
<div class="scegli lista">
  {% for d in in_turno %}<label><input type="radio" name="manutentore" value="{{ d.pk }}" required {% if d.pk == i.assegnata_a_id or not i.assegnata_a_id and forloop.first %}checked{% endif %}><span>{{ d.nome_breve }} <em>in turno · {{ d.turno_oggi.descrizione_fascia }}</em></span></label>{% endfor %}
  {% for d in altri_manutentori %}<label><input type="radio" name="manutentore" value="{{ d.pk }}" required {% if d.pk == i.assegnata_a_id %}checked{% endif %}><span>{{ d.nome_breve }}</span></label>{% endfor %}
</div>
