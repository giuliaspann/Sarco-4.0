{% extends 'turni/base.html' %}
{% block titolo %}Cambia password{% endblock %}
{% block contenuto %}
<a class="tasto-indietro" href="{% url 'turni:profilo' %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>Profilo</a>
<div class="intestazione"><h1>Cambia password</h1></div>
<form method="post" class="scheda">{% csrf_token %}
  {{ form.non_field_errors }}
  {% for campo in form %}
  <label>{{ campo.label }}{{ campo }}</label>
  {% for e in campo.errors %}<p class="errore">{{ e }}</p>{% endfor %}
  {% endfor %}
  <button class="bottone pieno piena-larghezza">Salva</button>
</form>
{% endblock %}
