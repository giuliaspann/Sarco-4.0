{% extends 'turni/base.html' %}

{% block titolo %}Produzione del turno{% endblock %}
{% block contenuto %}

<div class="intestazione"><h1>Inserisci produzione del turno</h1></div>
<p class="mn-sottotitolo">Quale impianto?</p>
<div class="rp-aree">
  {% for codice, nome, icona in impianti %}
  <a href="?impianto={{ codice }}"><i class="rp-ico">{{ icona }}</i>{{ nome }}</a>
  {% endfor %}
</div>
{% endblock %}
