{% extends 'turni/base.html' %}
{% block titolo %}Dipendenti{% endblock %}
{% block contenuto %}
<a class="tasto-indietro" href="{% url 'turni:archivio' %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Archivio</a>
<div class="intestazione"><h1>Dipendenti</h1></div>
<form method="get" class="ac-cerca"><input type="text" name="q" value="{{ q }}" placeholder="Cerca per nome" aria-label="Cerca per nome"><button class="bottone pieno">Cerca</button></form>
<div class="archivio-voci">
{% for d in elenco %}
<a class="sg-macchina" href="{% url 'turni:archivio_dipendente' d.pk %}"><span class="rq-testo"><b>{{ d.nome_breve }}</b><small>{{ d.mansioni_display }}</small></span><span class="sg-freccia">›</span></a>
{% empty %}
<div class="vuoto"><p>Nessun dipendente trovato.</p></div>
{% endfor %}
</div>
{% endblock %}
