{% extends 'turni/base.html' %}
{% block titolo %}Profilo{% endblock %}
{% block contenuto %}
<a class="tasto-indietro" href="{% url 'turni:home' %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>Home</a>
<div class="ig-profilo">
  <span class="ig-profilo-foto"><span>{{ iniziali }}</span></span>
  <div><h1>{{ nome }}</h1>{% if ruoli %}<p class="tenue">{{ ruoli }}</p>{% endif %}</div>
</div>

<div class="ig-tasti">
  <a href="{% url 'turni:password' %}">Cambia password</a>
  <a href="{% url 'turni:menu' %}">Menu</a>
</div>

<form method="post" action="{% url 'turni:logout' %}">{% csrf_token %}
  <button class="bottone avviso-btn piena-larghezza" type="submit">Esci</button>
</form>
{% endblock %}
